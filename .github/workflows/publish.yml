name: Build and Publish Images

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image prefix
        id: image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=${OWNER}/interactive-system-architecture-portfolio" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-frontend:${{ steps.meta.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-frontend:latest \
            ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-frontend:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push backend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-backend:latest

      - name: Push frontend image
        run: |
          docker push ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-frontend:${{ steps.meta.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-frontend:latest