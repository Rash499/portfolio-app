```yaml
name: Build, Publish and Update GitOps

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set image prefix
        id: image
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=${OWNER}/interactive-system-architecture-portfolio" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Build Docker images
      # --------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-frontend:${{ steps.meta.outputs.tag }} \
            ./frontend

      # --------------------------------------------------
      # Security scanning
      # --------------------------------------------------

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-frontend:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      # --------------------------------------------------
      # Push images to GitHub Container Registry
      # --------------------------------------------------

      - name: Push backend image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }}

      - name: Push frontend image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}-frontend:${{ steps.meta.outputs.tag }}

      # --------------------------------------------------
      # Checkout GitOps repository
      # --------------------------------------------------

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Rash499/portfolio-app-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: master
          path: gitops

      # --------------------------------------------------
      # Update GitOps image tags
      # --------------------------------------------------

      - name: Update GitOps image tags
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("environments/development/values.yaml")
          text = path.read_text()

          tag = os.environ["IMAGE_TAG"]

          lines = text.splitlines()

          in_images = False
          current_image = None

          for i, line in enumerate(lines):
              stripped = line.strip()

              # Enter images section
              if stripped == "images:":
                  in_images = True
                  current_image = None
                  continue

              # Leave images section when another top-level
              # YAML key starts
              if in_images and line and not line.startswith(" "):
                  in_images = False
                  current_image = None
                  continue

              # Detect backend/frontend section
              if in_images and stripped in ("backend:", "frontend:"):
                  current_image = stripped[:-1]
                  continue

              # Update the tag belonging to backend/frontend
              if (
                  in_images
                  and current_image in ("backend", "frontend")
                  and stripped.startswith("tag:")
              ):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = f'{indent}tag: "{tag}"'
                  current_image = None

          path.write_text("\n".join(lines) + "\n")
          PY

          echo "----------------------------------------"
          echo "Updated GitOps values.yaml:"
          echo "----------------------------------------"

          cat environments/development/values.yaml

          echo "----------------------------------------"
          echo "Git diff:"
          echo "----------------------------------------"

          git diff -- environments/development/values.yaml

      # --------------------------------------------------
      # Commit and push GitOps change
      # --------------------------------------------------

      - name: Commit and push GitOps update
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add environments/development/values.yaml

          git commit \
            -m "chore: deploy application ${IMAGE_TAG}" \
            || echo "No changes to commit"

          git push origin master
```
